[package]
name = "skipper-db"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "db-cli"
path = "src/bin/db-cli.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
